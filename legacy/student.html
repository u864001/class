<!DOCTYPE html>
<html lang="zh-TW">
<head>
<script>
window.alert = function(msg) {
    const overlay = document.createElement('div');
    overlay.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);";
    const box = document.createElement('div');
    box.style.cssText = "background:#fff;padding:24px;border-radius:12px;min-width:320px;max-width:400px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.2);font-family:sans-serif;";
    const msgEl = document.createElement('p');
    msgEl.innerText = msg;
    msgEl.style.cssText = "margin-bottom:24px;color:#333;white-space:pre-wrap;line-height:1.5;font-size:16px;";
    const btnOk = document.createElement('button');
    btnOk.innerText = "確定";
    btnOk.style.cssText = "background:#3b82f6;color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;width:100%;font-size:16px;";
    btnOk.onclick = () => document.body.removeChild(overlay);
    box.appendChild(msgEl); box.appendChild(btnOk); overlay.appendChild(box); document.body.appendChild(overlay);
};
window.asyncConfirm = function(msg) {
    return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);";
        const box = document.createElement('div');
        box.style.cssText = "background:#fff;padding:24px;border-radius:12px;min-width:320px;max-width:400px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.2);font-family:sans-serif;";
        const msgEl = document.createElement('p');
        msgEl.innerText = msg;
        msgEl.style.cssText = "margin-bottom:24px;color:#333;white-space:pre-wrap;line-height:1.5;font-size:16px;";
        const btnGroup = document.createElement('div');
        btnGroup.style.cssText = "display:flex;gap:12px;justify-content:center;";
        const btnCancel = document.createElement('button');
        btnCancel.innerText = "取消";
        btnCancel.style.cssText = "background:#f1f5f9;color:#475569;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;flex:1;font-size:16px;";
        btnCancel.onclick = () => { document.body.removeChild(overlay); resolve(false); };
        const btnOk = document.createElement('button');
        btnOk.innerText = "確定";
        btnOk.style.cssText = "background:#ef4444;color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;flex:1;font-size:16px;";
        btnOk.onclick = () => { document.body.removeChild(overlay); resolve(true); };
        btnGroup.appendChild(btnCancel); btnGroup.appendChild(btnOk);
        box.appendChild(msgEl); box.appendChild(btnGroup); overlay.appendChild(box); document.body.appendChild(overlay);
    });
};
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>霧臺國小 - 學生作答</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
:root {
    --primary: #4f46e5; --primary-light: rgba(79,70,229,0.1);
    --success: #10b981; --success-light: rgba(16,185,129,0.15);
    --danger: #ef4444; --warning: #f59e0b;
    --text-primary: #1e293b; --text-secondary: #64748b; --text-muted: #94a3b8;
    --radius: 16px; --radius-full: 9999px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', 'PingFang TC', system-ui, sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 40%, #fdf2f8 100%);
    min-height: 100dvh; display: flex; justify-content: center; align-items: center;
    padding: 12px;
    padding-top: calc(12px + var(--safe-top));
    padding-bottom: calc(12px + var(--safe-bottom));
    overflow: hidden; -webkit-user-select: none; user-select: none;
}
.student-container {
    width: 100%; max-width: 680px;
    height: calc(100dvh - 24px - var(--safe-top) - var(--safe-bottom));
    max-height: 820px;
    background: rgba(255,255,255,0.75); backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.6);
    border-radius: 28px; box-shadow: 0 16px 48px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; overflow: hidden; position: relative;
}
/* 頂部 */
.stu-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px; background: rgba(255,255,255,0.5);
    border-bottom: 1px solid rgba(255,255,255,0.6);
    font-size: 13px; font-weight: 600; color: var(--text-primary); gap: 8px; flex-shrink: 0;
}
.stu-header .identity { display: flex; align-items: center; gap: 6px; flex: 1; overflow: hidden; }
.stu-header .change-btn {
    font-size: 11px; font-weight: 500; color: var(--primary);
    background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.4);
    border-radius: 20px; padding: 4px 10px; cursor: pointer;
    display: flex; align-items: center; gap: 4px; flex-shrink: 0;
}
.stu-header .change-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.lang-toggle { display: flex; gap: 2px; }
.lang-toggle button {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid transparent; background: rgba(255,255,255,0.5);
    font-size: 12px; font-weight: 600; cursor: pointer;
}
.lang-toggle button.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
/* 跑馬燈 - 固定高度 */
.stu-marquee {
    height: 38px; min-height: 38px; max-height: 38px;
    padding: 0 18px; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; flex-shrink: 0;
    background: rgba(255,200,50,0.06); color: transparent;
    overflow: hidden; white-space: nowrap; position: relative;
}
.stu-marquee.active { color: #b45309; background: rgba(255,200,50,0.18); }
.stu-marquee.scroll span { display: inline-block; animation: marquee 8s linear 2; }
@keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
/* 題目區 */
.stu-question {
    padding: 10px 18px; display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 600; color: var(--text-primary);
    background: rgba(255,255,255,0.4); flex-shrink: 0;
}
.stu-question .q-score {
    margin-left: auto; font-size: 12px; color: var(--primary);
    background: var(--primary-light); padding: 3px 10px; border-radius: 20px; white-space: nowrap;
}
/* 計時器 */
.stu-timer {
    text-align: center; font-size: 38px; font-weight: 700; padding: 2px;
    color: var(--text-primary); flex-shrink: 0; min-height: 44px;
}
.stu-timer.urgent { color: var(--danger); animation: pulse 0.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes spin { 100% { transform: rotate(360deg); } }
/* 作答區 */
.stu-answer {
    flex: 1; display: flex; flex-direction: column; padding: 10px 18px;
    gap: 8px; overflow-y: auto; min-height: 0;
}
/* 教師附加的參考圖片（選擇題/文字題用）：flex-shrink 讓它跟作答區彈性分配高度，
   但保留 min-height 讓作答控制項（ABCD/送出）永遠有足夠空間，不會被擠出畫面 */
.ref-image-wrap {
    flex: 1 1 auto; min-height: 70px; max-height: 42%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.03); border-radius: 16px; overflow: hidden;
    cursor: zoom-in; position: relative;
}
.ref-image-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; }
.ref-image-wrap .zoom-hint {
    position: absolute; bottom: 6px; right: 8px; background: rgba(0,0,0,0.5);
    color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 20px;
    display: flex; align-items: center; gap: 3px;
}
/* 全螢幕放大燈箱 */
.lightbox-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 500;
    display: flex; align-items: center; justify-content: center;
}
.lightbox-overlay.hidden { display: none; }
.lightbox-overlay img { max-width: 94vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
.lightbox-close {
    position: absolute; top: 16px; right: 16px; width: 40px; height: 40px;
    border-radius: 50%; border: none; background: rgba(255,255,255,0.15);
    color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.choice-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1 1 auto; min-height: 130px; align-content: center;
}
.choice-btn {
    background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
    border: 2px solid rgba(255,255,255,0.6); border-radius: 20px;
    font-size: 24px; font-weight: 700; color: var(--text-primary);
    cursor: pointer; min-height: 60px; transition: all 0.2s;
}
.choice-btn:hover:not(:disabled):not(.locked) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
.choice-btn.selected { border-color: var(--primary); background: rgba(79,70,229,0.15); }
.choice-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.text-input-wrap { flex: 1 1 auto; min-height: 110px; display: flex; flex-direction: column; gap: 8px; }
.text-input-wrap textarea {
    flex: 1; padding: 14px; border: 2px solid rgba(0,0,0,0.08);
    border-radius: 18px; font-size: 16px; background: rgba(255,255,255,0.8);
    resize: none; font-family: inherit; min-height: 80px;
}
.text-input-wrap textarea:disabled { opacity: 0.4; }
.char-count { text-align: right; font-size: 12px; color: var(--text-muted); }
/* 圖片畫布 */
.image-canvas-wrap { flex: 1; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.canvas-toolbar {
    display: flex; gap: 6px; align-items: center; width: 100%;
    justify-content: center; flex-wrap: wrap; padding: 4px 0;
}
.color-dot {
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; transition: border-color 0.15s;
    flex-shrink: 0;
}
.color-dot.active { border-color: var(--primary); box-shadow: 0 0 0 2px white, 0 0 0 4px var(--primary); }
.canvas-tool-btn {
    border: 1px solid rgba(0,0,0,0.12); border-radius: 8px; padding: 4px 10px;
    font-size: 13px; cursor: pointer; background: rgba(255,255,255,0.7);
    display: flex; align-items: center; gap: 3px; white-space: nowrap;
}
.canvas-tool-btn:hover { background: white; }
#drawingCanvas {
    border: 1.5px solid rgba(0,0,0,0.1); border-radius: 12px;
    touch-action: none; background: #fff; max-width: 100%;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.canvas-placeholder {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--text-muted); font-size: 14px; text-align: center;
    border: 2px dashed rgba(0,0,0,0.1); border-radius: 16px; padding: 24px; width: 100%;
}
/* 送出 */
.stu-submit { flex-shrink: 0; padding: 0 18px 14px; }
.stu-submit button {
    width: 100%; padding: 13px; border: none; border-radius: 18px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white; font-size: 17px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 18px rgba(79,70,229,0.3); transition: all 0.2s;
}
.stu-submit button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(79,70,229,0.4); }
.stu-submit button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.stu-submit button.submitted { background: linear-gradient(135deg, #10b981, #059669); }
/* 狀態列 */
.stu-status {
    flex-shrink: 0; text-align: center; padding: 7px; font-size: 12px; font-weight: 600;
    color: var(--text-secondary); background: rgba(255,255,255,0.4);
    border-top: 1px solid rgba(255,255,255,0.6);
}
/* 毛玻璃彈窗 */
.stu-modal-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.3);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; justify-content: center; align-items: center; z-index: 20;
}
.stu-modal-overlay.hidden { display: none; }
.stu-modal-box {
    background: rgba(255,255,255,0.88); backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px); border-radius: 24px;
    padding: 28px; width: 90%; max-width: 360px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2); text-align: center;
}
.stu-modal-box .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
.stu-modal-box .buzz-display { font-size: 72px; font-weight: 700; margin: 12px 0; color: var(--primary); }
.stu-modal-box .buzz-display.active { color: var(--success); }
.vote-options-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.vote-option-btn {
    padding: 12px; border-radius: 14px; border: 2px solid rgba(0,0,0,0.08);
    background: rgba(255,255,255,0.7); font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.15s;
}
.vote-option-btn.selected { border-color: var(--primary); background: rgba(79,70,229,0.1); }
.vote-option-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.vote-result-item { display:flex; align-items:center; gap:8px; padding:6px 0; text-align:left; }
.vote-bar-wrap { flex:1; height:8px; background:rgba(0,0,0,0.06); border-radius:4px; overflow:hidden; }
.vote-bar-fill { height:100%; background:var(--primary); border-radius:4px; transition:width 0.4s; }
.btn-modal-submit {
    width: 100%; max-width: 240px; padding: 12px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white;
    font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 8px;
    transition: all 0.3s ease;
}
/* 倒數期間灰化，清楚表示尚無法按下 */
.btn-modal-submit:disabled {
    background: rgba(100,100,120,0.2);
    color: rgba(0,0,0,0.3);
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}
/* 倒數歸零後的「可按」脈動效果，吸引學生注意 */
.btn-modal-submit.ready {
    background: linear-gradient(135deg, #10b981, #059669);
    animation: buzzReady 0.6s ease infinite alternate;
    box-shadow: 0 0 0 0 rgba(16,185,129,0.5);
}
@keyframes buzzReady {
    from { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); transform: scale(1); }
    to   { box-shadow: 0 0 0 12px rgba(16,185,129,0); transform: scale(1.03); }
}
.btn-modal-close {
    padding: 8px 20px; border: none; border-radius: 12px;
    background: rgba(255,255,255,0.6); font-size: 14px; font-weight: 600; cursor: pointer;
}
/* 登入畫面 */
.login-overlay {
    position: absolute; inset: 0; background: rgba(255,255,255,0.9);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px; z-index: 30; border-radius: 28px;
}
.login-overlay.hidden { display: none; }
.login-title { font-size: 26px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
.login-subtitle { font-size: 14px; color: var(--text-secondary); }
.login-input {
    width: 100%; max-width: 240px; padding: 14px; text-align: center;
    font-size: 28px; font-weight: 700; letter-spacing: 8px;
    border: 2px solid rgba(0,0,0,0.08); border-radius: 20px;
    background: rgba(255,255,255,0.8); color: var(--primary);
}
.login-join {
    width: 100%; max-width: 240px; padding: 14px; border: none;
    border-radius: 20px; background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white; font-size: 18px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 18px rgba(79,70,229,0.3);
}
.login-selects { display: flex; gap: 8px; width: 100%; max-width: 320px; }
.login-selects select {
    flex: 1; padding: 10px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.08);
    background: rgba(255,255,255,0.7); font-size: 15px; font-weight: 500;
}
.login-status { font-size: 13px; color: var(--text-muted); text-align: center; min-height: 20px; }
.hidden { display: none !important; }
/* 響應式 */
@media (max-width: 480px) {
    .student-container { height: calc(100dvh - 8px); max-height: none; border-radius: 20px; }
    .choice-btn { font-size: 20px; min-height: 52px; }
    .stu-timer { font-size: 32px; }
    .stu-question { font-size: 13px; }
    .stu-marquee { height: 34px; min-height: 34px; max-height: 34px; font-size: 13px; }
}
@media (min-width: 768px) and (orientation: landscape) {
    .student-container { height: calc(100dvh - 40px); max-height: 700px; }
    .stu-question { font-size: 17px; padding: 14px 20px; }
    .stu-timer { font-size: 44px; min-height: 54px; }
    .choice-btn { font-size: 26px; min-height: 68px; }
    .stu-submit button { font-size: 19px; padding: 15px; }
}
</style>

<style>
.lang-btn { background: rgba(255,255,255,0.5); color: var(--text-primary); }
.lang-btn.active { background: var(--btn-gradient, var(--primary)) !important; color: white !important; border-color: transparent !important; }
</style>
</head>
<body>
<div class="student-container" id="app">

    <!-- 頂部資訊列 -->
    <div class="stu-header">
        <span class="identity">
            <span class="material-symbols-outlined" style="font-size:16px;color:var(--primary);">person</span>
            <span id="identityText" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">--</span>
            <button class="change-btn" id="changeStudentBtn" disabled>
                <span class="material-symbols-outlined" style="font-size:13px;">autorenew</span>
                <span id="changeLabel">更換</span>
            </button>
        </span>
        <span style="display:flex; align-items:center; gap:8px;">
        <span style="position:relative; display:flex;">
            <button id="skinToggleBtn" title="切換主題" style="height:30px; width:30px; border-radius:50%; border:1px solid rgba(255,255,255,0.4); background:rgba(255,255,255,0.5); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; transition:all 0.2s; box-shadow:0 2px 5px rgba(0,0,0,0.05);">🎨</button>
            <div id="skinDropdown" style="display:none;position:absolute;top:38px;right:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border:1px solid rgba(0,0,0,0.1);border-radius:12px;padding:8px;min-width:180px;box-shadow:0 10px 30px rgba(0,0,0,0.15);z-index:9999; flex-wrap:wrap; gap:6px;"></div>
        </span>
        <span class="lang-toggle" style="display:flex; gap:4px;">
            <button id="langZh" class="active" style="height:30px; padding:0 12px; border-radius:15px; border:1px solid transparent; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s;" class="lang-btn">中</button>
            <button id="langEn" style="height:30px; padding:0 12px; border-radius:15px; border:1px solid transparent; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s;" class="lang-btn">EN</button>
        </span>
        </span>
        <span style="font-size:12px;color:var(--text-muted);" id="roomDisplay">----</span>
        <span style="font-size:12px;color:var(--text-muted);" id="roundDisplay">--</span>
    </div>

    <!-- 跑馬燈（固定高度，不跳動） -->
    <div class="stu-marquee" id="marqueeArea"><span id="marqueeSpan"></span></div>

    <!-- 題目 -->
    <div class="stu-question" id="questionArea">
        <span class="material-symbols-outlined" style="flex-shrink:0;">menu_book</span>
        <span id="questionText">等待教師出題...</span>
        <span class="q-score" id="scoreDisplay">1分</span>
    </div>

    <!-- 計時器 -->
    <div class="stu-timer" id="timerDisplay">--</div>

    <!-- 作答區 -->
    <div class="stu-answer hidden" id="answerArea">
        <!-- 教師附加的參考圖片（僅選擇題/文字題顯示；圖片題本身用畫布顯示，不需要這個） -->
        <div class="ref-image-wrap hidden" id="refImageWrap">
            <img id="refImage" alt="參考圖片" />
            <span class="zoom-hint"><span class="material-symbols-outlined" style="font-size:13px;">zoom_in</span> 點擊放大</span>
        </div>
        <!-- 選擇題 -->
        <div class="choice-grid" id="choiceGrid">
            <button class="choice-btn" data-choice="A" disabled>A</button>
            <button class="choice-btn" data-choice="B" disabled>B</button>
            <button class="choice-btn" data-choice="C" disabled>C</button>
            <button class="choice-btn" data-choice="D" disabled>D</button>
        </div>
        <!-- 文字題 -->
        <div class="text-input-wrap hidden" id="textInputWrap">
            <textarea id="textInput" placeholder="請輸入你的答案..." disabled></textarea>
            <div class="char-count" id="charCount">0 字</div>
        </div>
        <!-- 圖片/畫布題 -->
        <div class="image-canvas-wrap hidden" id="imageCanvasWrap">

// ── 畫布工具 ──
const ctx = drawingCanvas.getContext('2d');
let currentColor = '#1e293b';
let isDrawing = false;
let canvasHistory = [];
let teacherImageLoaded = false;

function saveCanvasState() {
    canvasHistory.push(drawingCanvas.toDataURL());
    if (canvasHistory.length > 30) canvasHistory.shift();
}
function setupCanvas(imageUrl) {
    teacherImageLoaded = false;
    const w = imageCanvasWrap.clientWidth || 400;
    if (imageUrl) {
        const img = new Image();
        img.onload = () => {
            const ratio = img.height / img.width;
            drawingCanvas.width  = Math.min(w, 600);
            drawingCanvas.height = Math.round(drawingCanvas.width * ratio);
            ctx.drawImage(img, 0, 0, drawingCanvas.width, drawingCanvas.height);
            teacherImageLoaded = true;
            canvasHistory = [];
            saveCanvasState();
            drawingCanvas.classList.remove('hidden');
            canvasPlaceholder.classList.add('hidden');
        };
        img.src = imageUrl;
    } else {
        drawingCanvas.width  = Math.min(w, 600);
        drawingCanvas.height = Math.round(drawingCanvas.width * 0.6);
        ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
        canvasHistory = [];
        drawingCanvas.classList.add('hidden');
        canvasPlaceholder.classList.remove('hidden');
    }
}
function getCanvasPos(e) {
    const rect = drawingCanvas.getBoundingClientRect();
    const src  = e.touches ? e.touches[0] : e;
    return {
        x: (src.clientX - rect.left) * (drawingCanvas.width  / rect.width),
        y: (src.clientY - rect.top)  * (drawingCanvas.height / rect.height)
    };
}
function startDraw(e) {
    if (STATE.isLocked) return;
    e.preventDefault();
    isDrawing = true;
    const p = getCanvasPos(e);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
}
function draw(e) {
    if (!isDrawing || STATE.isLocked) return;
    e.preventDefault();
    const p = getCanvasPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke();
}
function endDraw(e) {
    if (!isDrawing) return;
    e.preventDefault();
    isDrawing = false;
    ctx.closePath();
    saveCanvasState();
}
drawingCanvas.addEventListener('pointerdown', startDraw);
drawingCanvas.addEventListener('pointermove', draw);
drawingCanvas.addEventListener('pointerup', endDraw);
drawingCanvas.addEventListener('pointercancel', endDraw);

// 顏色選擇
[['colorBlack','#1e293b'],['colorRed','#ef4444'],['colorBlue','#3b82f6'],['colorGreen','#22c55e'],['colorYellow','#f59e0b']]

$('undoCanvasBtn').addEventListener('click', () => {

    canvasHistory.pop();
    const img = new Image();
    img.onload = () => { ctx.clearRect(0,0,drawingCanvas.width,drawingCanvas.height); ctx.drawImage(img,0,0); };
    img.src = canvasHistory[canvasHistory.length - 1];
});
$('clearCanvasBtn').addEventListener('click', () => {
    ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);

});
studentImageInput.addEventListener('change', e => {

            const w = imageCanvasWrap.clientWidth || 400;

            ctx.clearRect(0,0,drawingCanvas.width,drawingCanvas.height);

            canvasHistory = [];
            saveCanvasState();
            drawingCanvas.classList.remove('hidden');
            canvasPlaceholder.classList.add('hidden');
        };
        img.src = ev.target.result;
    };

});

function showVoteResults(results) {
    const opts = Object.keys(results || {});
    const total = Object.values(results || {}).reduce((a,b)=>a+b,0) || 1;
    const maxVal = Math.max(...Object.values(results || {}), 0);
    voteOptionsList.innerHTML = opts.map(opt => {
        const cnt = results[opt] || 0;
        const pct = Math.round(cnt/total*100);
        const isTop = maxVal > 0 && cnt === maxVal;
        return `<div class="vote-result-item">
            <span style="font-weight:700;min-width:60px;text-align:left;">${isTop ? '👑 ' : ''}${opt}</span>
            <div class="vote-bar-wrap"><div class="vote-bar-fill" style="width:${pct}%;"></div></div>
            <span style="font-size:13px;color:var(--text-muted);min-width:36px;">${cnt}票</span>
        </div>`;
    }).join('');
    voteSubmitBtn.style.display = 'none';
    voteCloseBtn.textContent = t('close');
    voteCloseBtn.onclick = () => { voteModal.classList.add('hidden'); STATE.voteLocked = false; };
    clearTimeout(window._voteResultTimer);

// Firestore 監聽器（含重連機制）
// ══════════════════════════════════════════════
let teacherCommandUnsub = null;
let myAnswerUnsub = null;
let teacherCommandRetryTimer = null;
let myAnswerRetryTimer = null;
let teacherCommandRetryCount = 0;

function listenTeacherCommands() {
    if (teacherCommandUnsub) { teacherCommandUnsub(); teacherCommandUnsub = null; }
    if (!STATE.roomId || !STATE.isLoggedIn) return;
    const roomRef = doc(db,'rooms',STATE.roomId);
    teacherCommandUnsub = onSnapshot(roomRef, async snapshot => {
        // 重連成功，清除重試狀態
        if (teacherCommandRetryCount > 0) {
            teacherCommandRetryCount = 0;
            setStatus('✅ ' + t('reconnected'), 'var(--success)');
        }
        const data = snapshot.data();
        if (!data) return;

        // ── 廣播跑馬燈（用時間戳判斷是否為新廣播，避免其他欄位更新誤觸發） ──
        const msg = (data.broadcastMsg || '').trim();
        const broadcastAtMs = data.broadcastAt?.toMillis ? data.broadcastAt.toMillis() : null;
        if (msg && broadcastAtMs && broadcastAtMs !== STATE.lastBroadcastAt) {
            STATE.lastBroadcastAt = broadcastAtMs;
            clearTimeout(marqueeArea._timeout);
            marqueeArea.classList.remove('scroll','active');
            marqueeSpan.textContent = '📢 ' + msg;
            void marqueeArea.offsetWidth;
            marqueeArea.classList.add('active');
            if (msg.length > 10) {
                marqueeArea.classList.add('scroll');
                marqueeSpan.addEventListener('animationend', function h() {
                    marqueeArea.classList.remove('scroll','active');
                    marqueeSpan.textContent = '';
                    marqueeSpan.removeEventListener('animationend', h);
                }, { once: true });
            } else {
                marqueeArea._timeout = setTimeout(() => {
                    marqueeArea.classList.remove('active');
                    marqueeSpan.textContent = '';
                }, 8000);
            }
        }

        // ── 廣播圖片（老師批閱後推送給全班看的圖片）──
        const broadcastImgUrl = data.broadcastImageUrl || '';
        const broadcastImgAtMs = data.broadcastImageAt?.toMillis ? data.broadcastImageAt.toMillis() : null;
        if (broadcastImgUrl && broadcastImgAtMs && broadcastImgAtMs !== STATE.lastBroadcastImageAt) {
            STATE.lastBroadcastImageAt = broadcastImgAtMs;
            showBroadcastImage(broadcastImgUrl);
        }

        // ── 畫面鎖定 ──
        if (data.isLocked) {
            $('waitOverlay').classList.remove('hidden');
            setStatus('🔒 ' + t('studentScreenLocked'), 'var(--danger)');
            return;
        } else {
            $('waitOverlay').classList.add('hidden');
        }

        // ── 投票 ──
        if (data.voteActive) {
            STATE.voteActive = true;
            STATE.voteOptions = data.voteOptions || [];
            if (voteModal.classList.contains('hidden')) openVoteModal();
        } else if (!data.voteActive && STATE.voteActive) {
            STATE.voteActive = false;
        }
        // 投票結果推送（用 voteResultsAt 時間戳判斷是否為新結果）
        const voteResultsAtMs = data.voteResultsAt?.toMillis ? data.voteResultsAt.toMillis() : null;
        if (data.voteResults && voteResultsAtMs && voteResultsAtMs !== STATE.lastVoteResultsAt) {
            STATE.lastVoteResultsAt = voteResultsAtMs;
            voteModal.classList.remove('hidden');
            showVoteResults(data.voteResults);
        } else if (!data.voteActive && (!data.voteResults || Object.keys(data.voteResults).length === 0)) {
            voteModal.classList.add('hidden');
            STATE.voteLocked = false;
        }

        // ── 搶答 ──
        if (data.buzzActive && !STATE.buzzActive) {
            STATE.buzzActive = true;
            STATE.buzzLocked = false;
            openBuzzModal(data.buzzCountdown || 5);
        } else if (!data.buzzActive && STATE.buzzActive) {
            STATE.buzzActive = false;
            closeBuzzModal();
        }

        // ── 清除（進入下一題） ──
        if (data.clearAll) {
            STATE.myAnswer = null; STATE.isLocked = false;
            STATE.voteLocked = false; STATE.buzzLocked = false;
            resetUI();
            enableInput(false);
            waitOverlay.classList.remove('hidden');
            setStatus('⏳ ' + t('studentWaiting'), '');
            return;
        }

        // ── 題目資訊 ──
        const roundId   = data.currentRoundId || '';
        const qType     = data.questionType || 'choice';
        const qNote     = data.questionNote || '';
        const qScore    = data.questionScore || 1;
        const imgUrl    = data.questionImageUrl || null;

        // 新題目 - 重置
        if (roundId && roundId !== STATE.currentRoundId) {
            STATE.currentRoundId = roundId;
            STATE.myAnswer = null; STATE.isLocked = false;
            STATE.questionType = qType;
            waitOverlay.classList.add('hidden');
            questionText.textContent = qNote || t('studentWaiting');
            scoreDisplay.textContent = `${qScore}${t('score') || '分'}`;
            roundDisplay.textContent = `#${data.currentQuestion || '?'}`;
            showSection(qType);
            // 選擇題/文字題：顯示參考圖片（若教師有附加）；圖片題本身用畫布，不用這個區塊
            showRefImage(qType !== 'image' ? imgUrl : null);
            answerArea.classList.remove('hidden');
            submitArea.classList.remove('hidden');
            enableInput(false);   // 先 disable，等 isAnswering 開啟
            if (qType === 'image') setupCanvas(imgUrl);
            listenMyAnswer();
        }

        // ── 作答中/停止 ──
        if (data.isAnswering && !STATE.isAnswering && !STATE.isLocked) {
            STATE.isAnswering = true;
            enableInput(true);
            startTimer(data.timerSeconds || 30);
            setStatus('✏️ ' + t('studentAnswering'), 'var(--primary)');
        } else if (!data.isAnswering && STATE.isAnswering) {
            STATE.isAnswering = false;
            clearTimer();
            if (!STATE.isLocked) {
                enableInput(false);
                setStatus('⏹️ ' + t('studentWaiting'), '');
            }
        }

        // ── 公布答案 ──
        if (data.revealedAnswer && data.questionType === 'choice') {
            const correct = data.revealedAnswer;
            document.querySelectorAll('.choice-btn').forEach(b => {
                if (b.dataset.choice === correct) b.style.background = 'rgba(16,185,129,0.3)';
                else if (b.classList.contains('selected')) b.style.background = 'rgba(239,68,68,0.2)';
            });
        }

    }, err => {
        console.warn('教師指令監聽失敗，將重試', err);
        teacherCommandUnsub = null;
        scheduleTeacherCommandRetry();
    });
}
function scheduleTeacherCommandRetry() {
    if (!STATE.isLoggedIn) return;
    setStatus('⚠️ ' + t('reconnecting'), 'var(--danger)');
    clearTimeout(teacherCommandRetryTimer);
    teacherCommandRetryCount++;
    const delay = Math.min(15000, 1000 * Math.pow(2, Math.min(teacherCommandRetryCount, 4)));
    teacherCommandRetryTimer = setTimeout(() => {
        if (STATE.isLoggedIn && STATE.roomId) listenTeacherCommands();
    }, delay);
}

function listenMyAnswer() {
    if (myAnswerUnsub) { myAnswerUnsub(); myAnswerUnsub = null; }
    if (!STATE.roomId || !STATE.studentId || !STATE.isLoggedIn) return;
    const ansRef = doc(db,'rooms',STATE.roomId,'answers',STATE.studentId);
    myAnswerUnsub = onSnapshot(ansRef, snapshot => {
        if (!snapshot.exists()) return;
        const data = snapshot.data();
        if (data.roundId !== STATE.currentRoundId) return;
        STATE.myAnswer = { choice: data.choice || null, text: data.text || null };
        STATE.isLocked = true;
        if (data.choice) document.querySelectorAll('.choice-btn').forEach(b => b.classList.toggle('selected', b.dataset.choice === data.choice));
        if (data.text) { textInput.value = data.text; charCount.textContent = data.text.length + ' 字'; }
        enableInput(false);
        setStatus('🔒 ' + t('studentLocked'), 'var(--success)');
    }, err => {
        console.warn('答案監聽失敗，將重試', err);
        myAnswerUnsub = null;
        clearTimeout(myAnswerRetryTimer);
        myAnswerRetryTimer = setTimeout(() => {
            if (STATE.isLoggedIn && STATE.roomId) listenMyAnswer();
        }, 3000);
    });
}

function cleanupListeners() {
    if (teacherCommandUnsub) { teacherCommandUnsub(); teacherCommandUnsub = null; }
    if (myAnswerUnsub) { myAnswerUnsub(); myAnswerUnsub = null; }
    clearTimeout(teacherCommandRetryTimer); teacherCommandRetryCount = 0;
    clearTimeout(myAnswerRetryTimer);
    clearTimer(); clearBuzzTimer();
}

// ══════════════════════════════════════════════
// 搶答
// ══════════════════════════════════════════════
function openBuzzModal(totalSeconds) {
    closeLightbox();
    buzzModal.classList.remove('hidden');
    STATE.buzzLocked = false;
    buzzBtn.disabled = true;
    buzzBtn.classList.remove('ready');  // 清除上一輪殘留的 ready 狀態
    buzzBtn.textContent = t('buzzBtn');
    buzzCountdownDisplay.textContent = totalSeconds;
    buzzCountdownDisplay.className = 'buzz-display';
    clearBuzzTimer();
    let remain = totalSeconds;
    buzzTimerInterval = setInterval(() => {
        remain--;
        buzzCountdownDisplay.textContent = remain;
        if (remain <= 0) {
            clearBuzzTimer();
            buzzBtn.disabled = false;
            buzzCountdownDisplay.textContent = '🔔';
            buzzCountdownDisplay.className = 'buzz-display active';
        }
    }, 1000);
    buzzBtn.onclick = async () => {
        if (STATE.buzzLocked) return;
        STATE.buzzLocked = true;
        buzzBtn.disabled = true;
        buzzBtn.classList.remove('ready');  // 停止脈動
        buzzBtn.textContent = '✅ ' + t('buzzDone');
        try {
            await setDoc(doc(db,'rooms',STATE.roomId,'buzzes',STATE.studentId), {
                name: STATE.studentName, studentId: STATE.studentId, timestamp: serverTimestamp()
            });
        } catch(e) { console.error('搶答寫入失敗', e); }
    };
}
function closeBuzzModal() {
    clearBuzzTimer();
    buzzModal.classList.add('hidden');
    buzzBtn.disabled = true;
    buzzBtn.classList.remove('ready');
    STATE.buzzLocked = false;
}
buzzCloseBtn.addEventListener('click', () => { closeBuzzModal(); STATE.buzzActive = false; });

// ══════════════════════════════════════════════
// 送出答案
// ══════════════════════════════════════════════
submitBtn.addEventListener('click', async () => {
    if (STATE.isLocked || submitBtn.disabled) return;
    let payload = { studentId: STATE.studentId, name: STATE.studentName, roundId: STATE.currentRoundId, timestamp: serverTimestamp() };
    if (STATE.questionType === 'choice') {
        const sel = document.querySelector('.choice-btn.selected');
        if (!sel) { alert(t('errorNoAnswer') || '請先選擇一個答案'); return; }
        payload.choice = sel.dataset.choice;
    } else if (STATE.questionType === 'text') {
        const txt = textInput.value.trim();
        if (!txt) { alert(t('errorNoAnswer') || '請先輸入答案'); return; }
        payload.text = txt;
    } else if (STATE.questionType === 'image') {
        if (canvasHistory.length === 0) { alert('請先在畫布上作答'); return; }
        payload.imageUrl = drawingCanvas.toDataURL('image/jpeg', 0.7);
    }
    submitBtn.disabled = true;
    try {
        await setDoc(doc(db,'rooms',STATE.roomId,'answers',STATE.studentId), payload);
        STATE.isLocked = true;
        enableInput(false);
        setStatus('✅ ' + t('studentSubmitted'), 'var(--success)');
    } catch(e) {
        console.error('送出失敗', e);
        submitBtn.disabled = false;
        alert('送出失敗，請重試');
    }
});

// 選擇題按鈕
document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        if (STATE.isLocked || btn.disabled) return;
        document.querySelectorAll('.choice-btn').forEach(b => { b.classList.remove('selected'); b.style.background = ''; });
        btn.classList.add('selected');
    });
});
textInput.addEventListener('input', () => { charCount.textContent = textInput.value.length + ' 字'; });

// ══════════════════════════════════════════════
// 更換學生
// ══════════════════════════════════════════════
changeBtn.addEventListener('click', async () => {
    if (!await window.asyncConfirm(t('confirmChange') || '確定要更換學生？')) return;
    await markOffline();
    cleanupListeners();
    STATE.isLoggedIn = false; STATE.studentId = null; STATE.studentName = null;
    STATE.voteActive = false; STATE.voteLocked = false;
    STATE.buzzActive = false; STATE.buzzLocked = false;
    STATE.lastBroadcastAt = null; STATE.lastVoteResultsAt = null; STATE.lastBroadcastImageAt = null;
    identityText.textContent = '--';
    changeBtn.disabled = true;
    loginScreen.classList.remove('hidden');
    resetUI();
    // 清除選班/座號
    seatSelect.innerHTML = '<option value="">-- 座號 --</option>';
    seatSelect.disabled = true;
});

// ══════════════════════════════════════════════
// 登入流程
// ══════════════════════════════════════════════
joinRoomBtn.addEventListener('click', handleJoinRoom);
roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleJoinRoom(); });

async function handleJoinRoom() {
    const code = roomInput.value.trim();
    if (code.length !== 4) { loginStatus.innerHTML = `<span style="color:var(--danger)">請輸入4位數教室代碼</span>`; return; }
    joinRoomBtn.disabled = true;
    loginStatus.textContent = '連線中...';
    try {
        const roomSnap = await getDoc(doc(db,'rooms',code));
        if (!roomSnap.exists()) {
            loginStatus.innerHTML = `<span style="color:var(--danger)">❌ ${t('errorNoRoom')}</span>`;
            joinRoomBtn.disabled = false; return;
        }
        const roomData = roomSnap.data();
        STATE.roomId = code;
        roomDisplay.textContent = code;
        // 載入名單
        const rosterUrl = "https://script.google.com/macros/s/AKfycbyTN6NbWdLc-OfKoa_3iyX5uHCwpDuEeIYSRSVgFcE4aM3RHHfgJthaAMXoiul2YTkH6A/exec";
        let rosterOk = false;
        try {
            const res = await fetch(rosterUrl);
            if (res.ok) {
                const json = await res.json();
                buildRoster(json.data || []);
                rosterOk = true;
            }
        } catch(e) { console.warn('載入名單失敗', e); }

        if (roomData.customClassEnabled) {
            // 自訂人數教室（無班級名單）
            const seats = roomData.customStudentCount || 20;
            classSelect.innerHTML = '<option value="custom">自訂座號</option>';
            seatSelect.innerHTML = '<option value="">-- 座號 --</option>' +
                Array.from({length: seats}, (_,i) => `<option value="${i+1}">${i+1} 號</option>`).join('');
            classSelect.disabled = false; seatSelect.disabled = false;
            nicknameWrap.classList.remove('hidden');
        } else if (rosterOk && STATE.allStudents.length > 0) {
            // 有班級名單
            populateClassSelect(roomData.selectedClasses || []);
            nicknameWrap.classList.add('hidden');
        } else {
            loginStatus.innerHTML = `<span style="color:var(--danger)">無法載入名單，請稍後再試</span>`;
            joinRoomBtn.disabled = false; return;
        }
        loginStatus.textContent = t('studentSelectClass') || '請選擇班級與座號';
        joinRoomBtn.disabled = false;
    } catch(e) {
        loginStatus.innerHTML = `<span style="color:var(--danger)">連線失敗：${e.message}</span>`;
        joinRoomBtn.disabled = false;
    }
}

function buildRoster(data) {
    const rosterData = {}, allStudents = [];
    for (const r of data) {
        const grade = r.grade?.toString().trim(), cls = r.class?.toString().trim();
        const num = r.number?.toString().trim(), name = r.name?.trim();
        if (!grade || !cls || !num || !name) continue;
        const key = `${grade}-${cls}`;
        if (!rosterData[key]) rosterData[key] = [];
        rosterData[key].push({ grade, class: cls, number: num, name });
        allStudents.push({ grade, class: cls, number: num, name });
    }
    STATE.rosterData = rosterData;
    STATE.allStudents = allStudents;
}

function populateClassSelect(selectedClasses) {
    const keys = selectedClasses.length > 0
        ? selectedClasses.filter(k => STATE.rosterData[k])
        : Object.keys(STATE.rosterData);
    classSelect.innerHTML = '<option value="">-- 班級 --</option>' +
        keys.map(k => {
            const [g, c] = k.split('-');
            const label = LANG === 'zh'
                ? `${{1:'一',2:'二',3:'三',4:'四',5:'五',6:'六'}[g]||g}年${{1:'甲',2:'乙'}[c]||c}班`
                : `Grade ${g} Class ${{1:'A',2:'B'}[c]||c}`;
            return `<option value="${k}">${label}</option>`;
        }).join('');
    classSelect.disabled = false;
    classSelect.onchange = () => {
        const key = classSelect.value;
        seatSelect.innerHTML = '<option value="">-- 座號 --</option>';
        seatSelect.disabled = !key;
        if (!key) return;
        (STATE.rosterData[key] || []).sort((a,b) => parseInt(a.number)-parseInt(b.number))
            .forEach(s => { seatSelect.innerHTML += `<option value="${s.number}">${s.number} 號 ${s.name}</option>`; });
    };
}

// 暱稱長度限制：中文字視為權重2（等同5個中文字），英數字視為權重1（等同10個字母），超過就截斷
function sanitizeNickname(raw) {
    const s = (raw || '').trim();
    if (!s) return '';
    let weight = 0, result = '';
    for (const ch of s) {
        const isChinese = /[\u4e00-\u9fff]/.test(ch);
        const w = isChinese ? 2 : 1;
        if (weight + w > 10) break;
        weight += w; result += ch;
    }
    return result;
}
// 即時截斷輸入框內容，避免使用者一次貼上超長文字
if (typeof nicknameInput !== 'undefined' && nicknameInput) {
    nicknameInput.addEventListener('input', () => {
        const sanitized = sanitizeNickname(nicknameInput.value);
        if (sanitized !== nicknameInput.value.trim()) {
            // 只在真的超長被截斷時才覆寫，避免打字中間被強制移動游標
            const raw = nicknameInput.value;
            let weight = 0, cut = raw.length;
            for (let i = 0; i < raw.length; i++) {
                const w = /[\u4e00-\u9fff]/.test(raw[i]) ? 2 : 1;
                weight += w;
                if (weight > 10) { cut = i; break; }
            }
            if (cut < raw.length) nicknameInput.value = raw.slice(0, cut);
        }
    });
}

seatSelect.addEventListener('change', handleSeatSelect);

async function handleSeatSelect() {
    const seat = seatSelect.value;
    if (!seat) return;

    // 自訂人數教室
    if (classSelect.value === 'custom') {
        STATE.studentId = `temp_${seat}`;
        const nick = sanitizeNickname(nicknameInput.value);
        STATE.studentName = nick || `${seat}號`;
        await finishLogin();
        return;
    }
    const classKey = classSelect.value;
    const found = STATE.rosterData[classKey]?.find(s => s.number === seat);
    if (!found) { loginStatus.innerHTML = `<span style="color:var(--danger)">找不到此座號</span>`; return; }

    // 檢查是否已有其他裝置用這個座號登入
    loginStatus.textContent = '驗證中...';
    const studentId = getStudentId(found);
    try {
        const snap = await getDoc(doc(db,'rooms',STATE.roomId,'students',studentId));
        if (snap.exists() && snap.data().online) {
            if (!await window.asyncConfirm(`${found.name} 已在其他裝置登入，是否切換到本裝置？`)) {
                seatSelect.value = ''; loginStatus.textContent = ''; return;
            }
        }
    } catch(e) { console.warn('驗證失敗', e); }
    STATE.studentId   = studentId;
    STATE.studentName = found.name;
    await finishLogin();
}

async function finishLogin() {
    try {
        loginStatus.textContent = '登入中...';
        await markOnline();
        STATE.isLoggedIn = true;
        identityText.textContent = STATE.studentName;
        changeBtn.disabled = false;
        loginScreen.classList.add('hidden');
        setStatus('✅ ' + t('studentLoginStatus') || '已加入教室', 'var(--success)');
        listenTeacherCommands();
    } catch(e) {
        loginStatus.innerHTML = `<span style="color:var(--danger)">登入失敗：${e.message}</span>`;
    }
}

// ══════════════════════════════════════════════
// 頁面生命週期
// ══════════════════════════════════════════════
window.addEventListener('beforeunload', () => { markOffline(); });

// iPad 切回前景 / 網路恢復時強制重新訂閱監聽器
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && STATE.isLoggedIn && STATE.roomId) {
        listenTeacherCommands();
        listenMyAnswer();
    }
});
window.addEventListener('online', () => {
    if (STATE.isLoggedIn && STATE.roomId) { listenTeacherCommands(); listenMyAnswer(); }
});

// ── URL 帶入 room 代碼 ──
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom) {
    roomInput.value = urlRoom;
    roomDisplay.textContent = urlRoom;
    // 自動觸發連線
    handleJoinRoom();
}

applyI18n();
applyAutoSkin();
</script>

<script>
// ====== Skin Menu Logic ======
function setupSkinMenu() {
    import('./skins.js').then(skinsModule => {
        const { getSkinList, applySkin, initSkin } = skinsModule;
        initSkin();
        
        const btn = document.getElementById('skinToggleBtn');
        const dropdown = document.getElementById('skinDropdown');
        if (!btn || !dropdown) return;
        
        const list = getSkinList();
        dropdown.innerHTML = list.map(skin => 
            `<button class="skin-option" data-id="${skin.id}" style="padding:4px 8px; border:none; background:transparent; cursor:pointer; font-size:13px; font-weight:600; text-align:left; border-radius:6px; display:flex; align-items:center; gap:6px; width:48%;">
                <div style="width:12px; height:12px; border-radius:50%; background:${skin.primary};"></div> ${skin.label}
            </button>`
        ).join('');
        
        dropdown.querySelectorAll('.skin-option').forEach(opt => {
            opt.onclick = () => {
                applySkin(opt.dataset.id);
                dropdown.style.display = 'none';
            };
            opt.onmouseover = () => opt.style.background = 'rgba(0,0,0,0.05)';
            opt.onmouseout = () => opt.style.background = 'transparent';
        });
        
        btn.onclick = (e) => {
            e.stopPropagation();
            dropdown.style.display = dropdown.style.display === 'none' ? 'flex' : 'none';
        };
        
        document.addEventListener('click', (e) => {
            if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });
    });
}
window.addEventListener('DOMContentLoaded', setupSkinMenu);
</script>
