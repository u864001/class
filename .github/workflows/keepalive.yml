name: ClassQnA Supabase & Vercel Automated Keepalive Heartbeat

on:
  schedule:
    # 每天早晚固定各發送一次保活心跳 (UTC 01:00 與 13:00，即台灣時間 09:00 與 21:00)
    - cron: '0 1,13 * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    name: 🩺 守護打卡與健康探測
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 發送 Vercel 保活探針
        run: |
          echo "Pinging Vercel Keepalive API..."
          curl -sS -i --max-time 15 "https://classqna.vercel.app/api/keepalive" || true

      - name: 🚀 發送 Supabase REST 資料庫網關探針
        run: |
          echo "Pinging Supabase REST Gateway directly..."
          curl -sS -i --max-time 15 \
            "https://mmvxgenubpvzopshuvpl.supabase.co/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tdnhnZW51YnB2em9wc2h1dnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMzYxODAsImV4cCI6MjEwNTYxMjE4MH0.eQuUMJzYTbOP1oSfaAbMCfPIwb9GwWC7kxTB0gFQXEI' }}" || true
